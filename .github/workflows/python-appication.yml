name: Python application CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

    - name: Ejecutar la app (modo automático)
      run: python app.py suma 5 3

    - name: Test with pytest
      run: pytest

    - name: Simulación del deploy
      run: echo "Simulando despliegue en servidor..."

    - name: Construir imagen Docker
      run: docker build -t ghcr.io/ronalfcito/ejercicio:3.0.0 .

    - name: Login en GitHub Container Registry
      run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Publicar imagen
      run: docker push ghcr.io/ronalfcito/ejercicio:3.0.0
